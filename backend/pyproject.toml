[project]
name = "ai-agents-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.43.87",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.14.3",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "fastapi[standard]>=0.139.0",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "imagekitio>=5.7.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-litellm>=0.7.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.6",
    "langsmith>=0.9.3",
    "litellm>=1.90.2",
    "mcp[cli]>=1.28.1",
    "ngrok>=1.7.0",
    "numpy>=2.5.0",
    "openai>=2.44.0",
    "opencv-python-headless>=5.0.0.93",
    "pageindex>=0.2.8",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "tavily-python>=0.7.26",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
	"notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pyright]
include = ["app"]
exclude = [
    "**/__pycache__",
    ".venv",
]

typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
