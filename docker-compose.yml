# docker-compose.yml (project root)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: roadagent
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: roadagent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: